[package]
name = "gac"
version = "0.2.0"
edition = "2021"
description = "AI-powered CLI tool for generating meaningful commit messages using llama.cpp over llama-swap"
license = "MIT"
keywords = ["ai", "cli", "commit", "git", "llama-swap", "llama.cpp"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = { version = "1.0.103" }
askama = { version = "0.16.0" }
chrono = { version = "0.4.45" }
clap = { version = "4.6.1", features = ["derive"] }
dialoguer = { version = "0.12.0" }
dirs = { version = "6.0.0" }
futures-util = { version = "0.3.32" }
glob = { version = "0.3.3" }
indicatif = { version = "0.18.6" }
regex = { version = "1.13.0" }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150" }
tokio = { version = "1.52.3", features = ["full"] }
toml = { version = "1.1" }
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
