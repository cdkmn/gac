[package]
name = "gac"
version = "0.2.0"
edition = "2021"
description = "AI-powered CLI tool for generating meaningful commit messages using llama.cpp over llama-swap"
license = "MIT"
keywords = ["ai", "cli", "commit", "git", "llama-swap"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
aes-gcm = { version = "0.11.0", features = ["getrandom"] }
anyhow = { version = "1.0.104" }
argon2 = { version = "0.5.3", features = ["rand", "std"] }
askama = { version = "0.16.0" }
base64 = { version = "0.22.1" }
chrono = { version = "0.4.45" }
clap = { version = "4.6.2", features = ["derive", "env"] }
console = { version = "0.16.4" }
convert_case = { version = "0.11.0" }
dialoguer = { version = "0.12.0" }
dirs = { version = "6.0.0" }
futures-util = { version = "0.3.33" }
glob = { version = "0.3.3" }
indicatif = { version = "0.18.6" }
regex = { version = "1.13.1" }
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.150" }
tokio = { version = "1.53.0", features = ["macros", "rt-multi-thread", "time"] }
toml = { version = "1.1" }

[profile.release]
strip = true
lto = true
panic = "abort"
codegen-units = 1
