# gac config

# llama-swap base url
endpoint = "http://localhost:11438"

# Model name for generaion
model = "Gemma-4:E4B-QAT"

# An upper bound for the number of tokens that can be generated for a completion, including visible output tokens and reasoning tokens
max_completion_tokens = 4096

# Patterns for excluding files
exclude_patterns = [
  "package-lock.json",
  "yarn.lock",
  "pnpm-lock.yaml",
  "bun.lockb",
  "Cargo.lock",
  "poetry.lock",
  "*.lock",
]

# Scope definations
[scopes.api]
paths = ["src/api/**", "src/routes/**"]

[scopes.cli]
paths = ["src/cli/**", "src/main.rs"]

[scopes.db]
paths = ["src/db/**", "migrations/**"]
