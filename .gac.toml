# gac config

# llama-swap base url
endpoint = "http://localhost:11438"

# Model name for generation
model = "Gemma-4:E4B-QAT"

# An upper bound for the number of tokens that can be generated for a completion, including visible output tokens and reasoning tokens
max_completion_tokens = 4096

# Patterns for excluding files
exclude_patterns = [
  "package-lock.json",
  "yarn.lock",
  "pnpm-lock.yaml",
  "bun.lockb",
  "Cargo.lock",
  "poetry.lock",
  "*.lock",
]

# Scope definitions
[scopes.agents]
paths = [".agents/**", ".claude/**"]

[scopes.config]
paths = ["src/config.rs"]

[scopes.diff]
paths = ["src/diff.rs"]

[scopes.git]
paths = ["src/git.rs"]

[scopes.logging]
paths = ["src/logging.rs"]

[scopes.llama]
paths = ["src/llamaswap.rs"]

[scopes.prompt]
paths = ["src/prompt.rs"]

[scopes.stats]
paths = ["src/stats.rs"]

[scopes.cli]
paths = ["src/main.rs"]

[scopes.core]
paths = ["src/**"]

[scopes.templates]
paths = ["templates/**"]

[scopes.deps]
paths = ["Cargo.toml", "Cargo.lock"]

[scopes.build]
paths = [".cargo/**"]

[scopes.project]
paths = ["./*"]
