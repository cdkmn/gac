# gac config
[model]
name = "cogito:8b"
ollama_url = "http://localhost:11434"
think = false

[options]
num_ctx = 4096
num_predict = 256
temperature = 0.2
top_p = 0.9
num_gpu = 999

[diff]
max_chars = 6000
exclude_patterns = [
  "package-lock.json",
  "yarn.lock",
  "pnpm-lock.yaml",
  "bun.lockb",
  "Cargo.lock",
  "poetry.lock",
  "*.lock",
]
[scopes.agents]
paths = [".agents/**", ".claude/**"]
[scopes.config]
paths = ["src/config.rs"]
[scopes.diff]
paths = ["src/diff.rs"]
[scopes.git]
paths = ["src/git.rs"]
[scopes.logging]
paths = ["src/logging.rs"]
[scopes.ollama]
paths = ["src/ollama.rs"]
[scopes.prompt]
paths = ["src/prompt.rs"]
[scopes.stats]
paths = ["src/stats.rs"]
[scopes.cli]
paths = ["src/main.rs"]
[scopes.core]
paths = ["src/**"]
[scopes.templates]
paths = ["templates/**"]
[scopes.deps]
paths = ["Cargo.toml", "Cargo.lock"]
[scopes.project]
paths = ["./*"]
